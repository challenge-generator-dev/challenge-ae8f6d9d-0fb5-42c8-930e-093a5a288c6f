apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: microservices
  labels:
    app: transaction-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: transaction-service
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service-external
  namespace: microservices
  labels:
    app: transaction-service
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    app: transaction-service